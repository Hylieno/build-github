name: Create repository

on:
  workflow_dispatch:
    inputs:
      repository_name:
        description: Repository name without the owner
        required: true
        type: string
      visibility:
        description: Repository visibility
        required: false
        default: private
        type: choice
        options:
          - private
          - public
      description:
        description: Repository description
        required: false
        default: Created by the Build GitHub environment
        type: string

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository name
        env:
          REPOSITORY_NAME: ${{ inputs.repository_name }}
        run: |
          if [[ ! "$REPOSITORY_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid repository name"
            exit 1
          fi

      - name: Create repository
        env:
          GH_TOKEN: ${{ secrets.BUILD_GITHUB_PAT }}
          REPOSITORY_NAME: ${{ inputs.repository_name }}
          REPOSITORY_DESCRIPTION: ${{ inputs.description }}
          REPOSITORY_VISIBILITY: ${{ inputs.visibility || 'private' }}
        run: |
          test -n "$GH_TOKEN" || {
            echo "Repository secret BUILD_GITHUB_PAT is missing"
            exit 1
          }

          case "$REPOSITORY_VISIBILITY" in
            private) is_private=true ;;
            public) is_private=false ;;
            *) echo "Invalid repository visibility"; exit 1 ;;
          esac

          gh api \
            --method POST \
            /user/repos \
            -f "name=$REPOSITORY_NAME" \
            -f "description=$REPOSITORY_DESCRIPTION" \
            -F "private=$is_private" \
            -F auto_init=true \
            --jq '{full_name, html_url, private}'
